<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Calendar - Mundane Routine</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-card">
            <h1 class="calendar-title">Task Calendar</h1>
            
            <div class="calendar-header">
                <button id="prevMonthBtn" class="btn btn-blue">Previous Month</button>
                <h2 id="currentMonthYear">May 2025</h2>
                <button id="nextMonthBtn" class="btn btn-blue">Next Month</button>
            </div>

            <div class="calendar-grid-header">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div id="calendarGrid" class="calendar-grid">
                <!-- Calendar cells dynamically generated by script.js -->
            </div>

            <div class="calendar-footer">
                <a href="index.html" class="btn btn-success">Add More Tasks</a>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
